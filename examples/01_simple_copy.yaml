version: "1.0"
pipeline:
  name: "simple_copy"
  description: "Straight copy of customers to Parquet, range-partitioned."
  settings:
    max_threads: 4
    state_file: ".ldp/simple_copy.json"
  resources:
    connections:
      - name: "pg"
        type: "postgres"
        url: "env://LDP_PG_URL"
  dataflow:
    sources:
      - id: "src"
        connection: "pg"
        query: "SELECT id, name, status, amount, created_at, region, unit_price FROM customers"
        partitioning:
          type: "range"
          column: "id"
          chunks: 8
    targets:
      - id: "out"
        input: "src"
        type: "parquet"
        path: "./out/simple_copy/"
        compression: "zstd"
