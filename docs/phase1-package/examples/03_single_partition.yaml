version: "1.0"
pipeline:
  name: "single_partition"
  settings:
    max_threads: 1
    state_file: ".ldp/single_partition.json"
  resources:
    connections:
      - name: "pg"
        type: "postgres"
        url: "env://PG_URL"
  dataflow:
    sources:
      - id: "src"
        connection: "pg"
        query: "SELECT id, name, status, amount, created_at FROM customers WHERE amount > 500"
        partitioning:
          type: "none"
    targets:
      - id: "out"
        input: "src"
        type: "parquet"
        path: "./output/single_partition/"
        compression: "snappy"
