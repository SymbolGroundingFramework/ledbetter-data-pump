version: "1.0"
pipeline:
  name: "csv_target"
  settings:
    max_threads: 4
    state_file: ".ldp/csv_target.json"
  resources:
    connections:
      - name: "pg"
        type: "postgres"
        url: "env://PG_URL"
  dataflow:
    sources:
      - id: "src"
        connection: "pg"
        query: "SELECT id, name, status, amount, created_at FROM customers"
        partitioning:
          type: "range"
          column: "id"
          chunks: 4
    transformations:
      - id: "active_only"
        input: "src"
        type: "filter"
        condition: "status = 'ACTIVE'"
    targets:
      - id: "out"
        input: "active_only"
        type: "csv"
        path: "./output/customers_active.csv"
