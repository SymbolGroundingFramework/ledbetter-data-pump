version: "1.0"
pipeline:
  name: "simple_copy"
  settings:
    max_threads: 4
    state_file: ".ldp/simple_copy.json"
  resources:
    connections:
      - name: "pg"
        type: "postgres"
        url: "env://PG_URL"
  dataflow:
    sources:
      - id: "src"
        connection: "pg"
        query: "SELECT id, name, status, amount, created_at FROM customers"
        partitioning:
          type: "range"
          column: "id"
          chunks: 4
    targets:
      - id: "out"
        input: "src"
        type: "parquet"
        path: "./output/simple_copy/"
        compression: "zstd"
